[project]
name = "changelog-forge"
version = "0.1.0"
description = "A git range in, release notes for two audiences out: map-reduce over commits and PRs with a cheap and a capable model, deterministic verification of every reference, and a cost ledger."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Saad Khan" }]
dependencies = [
    # Provider layer, pinned to an exact commit of the public journey repo. A PEP 508 direct
    # reference works with every installer: uv sync (Vercel, Docker, CI), pip, and
    # `uv tool install git+https://github.com/saad-official/changelog-forge`.
    # See docs/decisions/0004-llm-kit-dependency.md (and its dev-time path override).
    "llm-kit @ git+https://github.com/saad-official/ai-engineering-journey.git@2d83dd543611d3644106d29f2f12ee8b092d9d09#subdirectory=packages/llm-kit",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tiktoken>=0.8",
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.scripts]
changelog-forge = "changelog_forge.cli:app"
migrate = "changelog_forge.db.migrate:main"
purge = "changelog_forge.db.migrate:purge_main"
evals = "changelog_forge.evals.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.16",
]

# No [tool.uv.sources] entry for llm-kit on purpose: the git reference above is the single
# source everywhere. To develop against the sibling checkout, overlay it per command:
#   uv run --with-editable ../../packages/llm-kit pytest -q
# Why: docs/decisions/0004-llm-kit-dependency.md

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/changelog_forge"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/changelog_forge/api/**" = ["B008"]
"src/changelog_forge/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs TEST_DATABASE_URL pointing at a disposable Postgres",
]
